[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-sip-client"
dynamic = ["version"]
description = "Pure-Python SIP VoIP client library"
authors = [
    {name = "SerafinoBarwinski"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/SerafinoBarwinski/simple-sip-python"
Repository = "https://github.com/SerafinoBarwinski/simple-sip-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
